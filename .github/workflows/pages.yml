name: Deploy Astra Oneshots to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install and build all games
        run: npm run setup
      - name: Prepare static Pages site
        run: node scripts/prepare-pages.mjs
      - name: Publish static site branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf . || true
          cp -R site/. .
          git add -A
          git commit -m "Deploy GitHub Pages site ${GITHUB_SHA}" || true
          git push --force origin HEAD:gh-pages
